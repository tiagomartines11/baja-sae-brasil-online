; Attachment upload limits for the Formula phpBB instance.
;
; The php:8.3-fpm-alpine base image ships upload_max_filesize=2M, which sits
; UNDER this board's phpBB max_filesize / max_filesize_pm of 10M — so a PM or
; post attachment between 2M and 10M that phpBB itself would accept was being
; truncated by PHP. Raised past the phpBB ceiling so phpBB's own limit (and
; its proper in-board error message) is the one users actually hit.
;
; Limits in play on this instance. nginx client_max_body_size and PHP
; post_max_size each cap the WHOLE request body; upload_max_filesize caps
; the individual file. The effective ceiling is the lowest of the three,
; and it must stay above phpBB's own limit so phpBB is the layer that
; rejects an oversized attachment — with a real message instead of a 413.
;   nginx client_max_body_size  12M  (nginx/conf.d*/phpbb-formula.conf)
;   PHP   post_max_size         13M  (below)
;   PHP   upload_max_filesize   12M  (below)
;   -> effective ceiling        12M
;   phpBB max_filesize / _pm    10M  (ACP setting, stored in the DB)
upload_max_filesize = 12M

; Raised from the base image's 8M default: post_max_size caps the whole
; request body and must stay >= upload_max_filesize, which is now 12M.
post_max_size = 13M
