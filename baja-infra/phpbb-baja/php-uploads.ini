; Attachment upload limits for the Baja phpBB instance.
;
; The php:8.3-fpm-alpine base image ships upload_max_filesize=2M, which sits
; UNDER this board's phpBB max_filesize / max_filesize_pm of 5M — so a PM or
; post attachment between 2M and 5M that phpBB itself would accept was being
; truncated by PHP. Raised past the phpBB ceiling so phpBB's own limit (and
; its proper in-board error message) is the one users actually hit.
;
; Values are deliberately identical to phpbb-formula's rather than sized to
; this board's smaller 5M phpBB limit. Keeping the infra layers uniform across
; the two instances means raising Baja's attachment limit later is an ACP
; setting change alone — no matching nginx edit, ini edit and image rebuild to
; remember. phpBB's 5M setting is what users actually hit today; the extra
; headroom below is inert until that setting moves.
;
; Limits in play on this instance. nginx client_max_body_size and PHP
; post_max_size each cap the WHOLE request body; upload_max_filesize caps
; the individual file. The effective ceiling is the lowest of the three,
; and it must stay above phpBB's own limit so phpBB is the layer that
; rejects an oversized attachment — with a real message instead of a 413.
;   nginx client_max_body_size  12M  (nginx/conf.d*/phpbb-baja.conf)
;   PHP   post_max_size         13M  (below)
;   PHP   upload_max_filesize   12M  (below)
;   -> effective ceiling        12M
;   phpBB max_filesize / _pm    5M   (ACP setting, stored in the DB)
upload_max_filesize = 12M

; Caps the whole request body, so it must stay >= upload_max_filesize.
post_max_size = 13M
