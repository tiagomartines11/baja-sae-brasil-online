services:
  mysql:
    image: mysql:8.4
    container_name: baja-mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      TZ: America/Sao_Paulo
      # Available to mysql/init/02-create-users.sh (which runs as part of
      # the container's first-boot init via /docker-entrypoint-initdb.d/).
      MYSQL_RESULTADOS_PASSWORD: ${MYSQL_RESULTADOS_PASSWORD}
      MYSQL_PHPBB_BAJA_PASSWORD: ${MYSQL_PHPBB_BAJA_PASSWORD}
      MYSQL_PHPBB_FORMULA_PASSWORD: ${MYSQL_PHPBB_FORMULA_PASSWORD}
    ports:
      - "127.0.0.1:3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql
      - ./mysql/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "mysql -uroot -p${MYSQL_ROOT_PASSWORD} -e 'SELECT 1 FROM phpbb_baja.phpbb_config LIMIT 1' >/dev/null 2>&1"]
      interval: 5s
      timeout: 5s
      retries: 30
      start_period: 90s
    networks:
      - baja

  redis:
    image: redis:7-alpine
    container_name: baja-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --save 900 1 --save 300 10 --maxmemory 128mb --maxmemory-policy volatile-lru
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - baja

  phpbb-baja:
    build:
      context: ..
      dockerfile: baja-infra/phpbb-baja/Dockerfile
    image: baja-phpbb-baja:latest
    container_name: baja-phpbb-baja
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      # Source of truth for the baja/auth extension's redirect validation.
      # The extension reads cached values from phpbb_config; the entrypoint
      # refreshes those rows from these env vars on every boot.
      BAJA_AUTH_ALLOWED_DOMAIN_SUFFIX: ${BAJA_AUTH_ALLOWED_DOMAIN_SUFFIX}
      BAJA_AUTH_DEFAULT_REDIRECT: ${BAJA_AUTH_DEFAULT_REDIRECT}
      # Used by baja-init.sh's wait-for-mysql loop (see entrypoint.sh).
      MYSQL_PHPBB_BAJA_PASSWORD: ${MYSQL_PHPBB_BAJA_PASSWORD}
    volumes:
      - phpbb_baja_html:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - baja

  phpbb-formula:
    build:
      context: ..
      dockerfile: baja-infra/phpbb-formula/Dockerfile
    image: baja-phpbb-formula:latest
    container_name: baja-phpbb-formula
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      MYSQL_PHPBB_FORMULA_PASSWORD: ${MYSQL_PHPBB_FORMULA_PASSWORD}
    volumes:
      - phpbb_formula_html:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
    networks:
      - baja

  baja-app:
    build:
      context: ./baja-app
    image: baja-app:latest
    container_name: baja-app
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      ENV: ${ENV}
      # Keys the /buscar per-document backoff. See .env.example.
      CERT_BACKOFF_SECRET: ${CERT_BACKOFF_SECRET}
      # Baja\Url builds every public-facing link from these — the same two
      # variables the nginx templates render server_name and the listen block
      # from, so a link can never name a host or scheme nginx is not serving.
      BAJA_DOMAIN: ${BAJA_DOMAIN}
      LISTEN_MODE: ${LISTEN_MODE}
      # phpBB session shim — see baja-php/src/Baja/Auth/SessionStore.php.
      # The shim connects as the `resultados` MySQL user (full grants on
      # baja_resultados, SELECT on phpbb_baja). One MySQL account, two
      # roles — same secret for both.
      PHPBB_DB_HOST: mysql
      PHPBB_DB_PORT: "3306"
      PHPBB_DB_NAME: phpbb_baja
      PHPBB_DB_USER: resultados
      PHPBB_DB_PASS: ${MYSQL_RESULTADOS_PASSWORD}
      PHPBB_COOKIE_PREFIX: ${PHPBB_COOKIE_PREFIX}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      SESSION_CACHE_TTL_SECONDS: ${SESSION_CACHE_TTL_SECONDS}
      ONESIGNAL_AUTH: ${ONESIGNAL_AUTH}
      REMOTE_KEY: ${REMOTE_KEY}
      RECAPTCHA_KEY: ${RECAPTCHA_KEY}
      SYSADMIN_1_EMAIL: ${SYSADMIN_1_EMAIL}
      SYSADMIN_2_EMAIL: ${SYSADMIN_2_EMAIL}
      # ----- API foundation (FP0) -----
      # RateLimiter reuses REDIS_HOST/REDIS_PORT above.
      API_CORS_ORIGINS: ${API_CORS_ORIGINS}
      STORAGE_ENCRYPTION_KEY: ${STORAGE_ENCRYPTION_KEY}
      LOG_LEVEL: ${LOG_LEVEL}
    volumes:
      - ${BAJA_APP_PATH}:/var/www/html
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - baja

  baja-js:
    build:
      context: ..
      dockerfile: baja-infra/baja-js/Dockerfile
    image: baja-js:latest
    container_name: baja-js
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      NODE_ENV: production
    networks:
      - baja

  nginx:
    image: nginx:1.27-alpine
    container_name: baja-nginx
    restart: unless-stopped
    environment:
      TZ: America/Sao_Paulo
      # One config set for every environment; these pick the domain and the
      # listen block. See nginx/templates/ and .env.example.
      BAJA_DOMAIN: ${BAJA_DOMAIN}
      FORMULA_DOMAIN: ${FORMULA_DOMAIN}
      LISTEN_MODE: ${LISTEN_MODE}
      # The image's 20-envsubst-on-templates.sh substitutes EVERY $VAR it
      # finds unless filtered — which would blank $host, $remote_addr,
      # $request_uri and the rest of nginx's own runtime variables, silently
      # breaking the Cloudflare real-IP restoration and every proxy header
      # while still starting cleanly. Restrict it to exactly our three.
      # The $$ is Compose escaping for a literal $.
      NGINX_ENVSUBST_FILTER: "^(BAJA_DOMAIN|FORMULA_DOMAIN|LISTEN_MODE)$$"
    ports:
      - "80:80"
    volumes:
      # Rendered to /etc/nginx/conf.d/ at container start. Subdirectories are
      # preserved, so templates/snippets/ lands at conf.d/snippets/ — outside
      # the conf.d/*.conf glob nginx auto-includes, which is what keeps the
      # listen snippets from being loaded as configs in their own right.
      - ./nginx/templates:/etc/nginx/templates:ro
      - phpbb_baja_html:/var/www/phpbb-baja:ro
      - phpbb_formula_html:/var/www/phpbb-formula:ro
      - ${BAJA_APP_PATH}:/var/www/baja-app:ro
    depends_on:
      - phpbb-baja
      - phpbb-formula
      - baja-app
      - baja-js
    networks:
      - baja

volumes:
  mysql_data:
  redis_data:
  phpbb_baja_html:
  phpbb_formula_html:

networks:
  baja:
    driver: bridge
