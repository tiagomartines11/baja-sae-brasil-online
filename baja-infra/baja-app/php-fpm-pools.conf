; PHP-FPM worker pools of baja-app.
;
; Copied into the image as /usr/local/etc/php-fpm.d/zzz-baja-pools.conf, so it
; is read after the PHP image's own www.conf and zz-docker.conf and wins over
; them.
;
; TWO POOLS, ON PURPOSE
;
; During an endurance race two very different loads hit this one container
; at the same time: the public results site (bursty, driven by the audience)
; and the lap counting uploads (steady, driven by the counters' phones, and
; the one thing that must not stall). With a single pool either one can use
; up every worker and starve the other. So lap counting uploads get workers
; of their own:
;
;   www       port 9000   everything else: results, juiz pages, review screen
;   contagem  port 9001   juiz/contagem_sync.php only (nginx routes it there)
;
; SIZES, AND WHY
;
; The production machine is small (2 vCPUs). A PHP worker of this
; application holds roughly 30 to 40 MB, so the 11 workers below are about
; 400 MB at the very most.
;
; [www] 8 workers. The image default is 5, which the results site alone
; exhausted at past events. More than about 4 workers per CPU buys nothing
; when the work is CPU and MySQL bound, so 8 is the ceiling for 2 vCPUs.
;
; [contagem] 3 workers, always running. The load is known in advance: about
; six phones, each sending a heartbeat every 5 seconds (one small query and
; one update, a few milliseconds), plus an upload with entries every 2 or 3
; seconds (around 10 to 20 ms). That is under 5% of ONE worker. The second
; worker is for the whole-race recalculation, which runs after an upload has
; been answered, at most once every 5 seconds, one at a time, and takes 0.1
; to 0.3 s. The third is headroom, for example for a phone delivering an
; hour of entries after being offline. "static" (no workers created on
; demand) because the load is constant and a worker that is already running
; answers a heartbeat faster than one that has to be started.

;
; LOOKING AT THEM
;
; Each pool answers "how busy are you?" at /fpm-status (active and idle
; workers, the queue, and how often the limit was reached). nginx does not
; route that path, so it cannot be reached from outside; it is read from
; inside the container by scripts/contagem-fpm-status.php, which the load
; test uses. BAJA_FPM_POOL lets a script say which pool served it, so a test
; can prove that uploads really go to their own workers.

[www]
env[BAJA_FPM_POOL] = www
pm.status_path = /fpm-status
pm = dynamic
pm.max_children = 8
pm.start_servers = 3
pm.min_spare_servers = 2
pm.max_spare_servers = 4
; A worker is replaced after this many requests, which bounds the damage of
; any slow memory leak over a long event.
pm.max_requests = 1000

[contagem]
user = www-data
group = www-data
listen = 9001
env[BAJA_FPM_POOL] = contagem
pm.status_path = /fpm-status
pm = static
pm.max_children = 3
pm.max_requests = 2000
; An upload that takes this long is broken. The phone will send it again.
request_terminate_timeout = 20s
; The application reads its configuration (database, Redis) from the
; container's environment, which FPM hides from workers unless told not to.
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
