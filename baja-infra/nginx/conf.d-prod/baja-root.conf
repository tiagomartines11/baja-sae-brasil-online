server {
    listen 443 ssl;
    server_name bajasaebrasil.com.br;

    ssl_certificate     /etc/letsencrypt/live/bajasaebrasil.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bajasaebrasil.com.br/privkey.pem;

    # The PHP API lives on its own vhost (baja-app-api.conf), per the
    # convention that *.bajasaebrasil.com.br is PHP and the apex path space
    # is Next.js. /api/ here stays free for Next.js route handlers.

    location / {
        proxy_pass http://baja-js:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}