# Restore the real client IP from Cloudflare's CF-Connecting-IP header.
#
# All production traffic arrives via Cloudflare, so without this $remote_addr
# is a Cloudflare edge IP — and the edge a given client exits from rotates
# between requests. phpBB runs with ip_check=2 (compares the first two octets
# of the session's stored IP against the request IP), so a rotating edge IP
# invalidates the session on nearly every page load and bounces the user back
# to login. This also makes access logs, rate limiting, and bans meaningful.
#
# The 00- prefix is load-bearing: nginx includes conf.d/*.conf alphabetically
# inside the http block, and these directives must be parsed before the server
# blocks that inherit them.
#
# Ranges from https://www.cloudflare.com/ips-v4 and .../ips-v6, fetched
# 2026-08-16. Cloudflare adds ranges occasionally; re-check these if origin
# logs start showing Cloudflare addresses again.

# IPv4
set_real_ip_from 173.245.48.0/20;
set_real_ip_from 103.21.244.0/22;
set_real_ip_from 103.22.200.0/22;
set_real_ip_from 103.31.4.0/22;
set_real_ip_from 141.101.64.0/18;
set_real_ip_from 108.162.192.0/18;
set_real_ip_from 190.93.240.0/20;
set_real_ip_from 188.114.96.0/20;
set_real_ip_from 197.234.240.0/22;
set_real_ip_from 198.41.128.0/17;
set_real_ip_from 162.158.0.0/15;
set_real_ip_from 104.16.0.0/13;
set_real_ip_from 104.24.0.0/14;
set_real_ip_from 172.64.0.0/13;
set_real_ip_from 131.0.72.0/22;

# IPv6
set_real_ip_from 2400:cb00::/32;
set_real_ip_from 2606:4700::/32;
set_real_ip_from 2803:f800::/32;
set_real_ip_from 2405:b500::/32;
set_real_ip_from 2405:8100::/32;
set_real_ip_from 2a06:98c0::/29;
set_real_ip_from 2c0f:f248::/32;

real_ip_header CF-Connecting-IP;
