server {
    listen 443 ssl;
    server_name forum.bajasaebrasil.net;

    ssl_certificate     /etc/letsencrypt/live/bajasaebrasil.net/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bajasaebrasil.net/privkey.pem;

    root /var/www/phpbb-baja;
    index index.php index.html;

    # Attachment uploads: must stay above phpBB's max_filesize /
    # max_filesize_pm (5M on phpbb-baja) or nginx rejects the POST with a
    # 413 before phpBB or PHP ever run, which the board surfaces as a
    # generic "Erro HTTP". Set to 12M to match phpbb-formula rather than
    # sized to this board's smaller 5M limit, so the two instances stay
    # uniform and a future limit raise is an ACP change alone. Keep in step
    # with upload_max_filesize in baja-infra/phpbb-baja/php-uploads.ini.
    client_max_body_size 12M;

    location ~ /(config\.php|common\.php|cache|files|images/avatars/upload|includes|(?<!ext/)phpbb(?!\w)|store|vendor) {
        deny all;
        internal;
    }

    location / {
        try_files $uri $uri/ @rewriteapp;
    }

    location @rewriteapp {
        rewrite ^(.*)$ /app.php/$1 last;
    }

    location ~ \.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_pass phpbb-baja:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~* \.(jpg|jpeg|gif|png|css|js|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}