# PHP API vhost (prod). Serves baja-php/api/.
#
# See conf.d/baja-app-api.conf for the dev counterpart. The only difference
# that matters is client-IP resolution: in prod this sits behind Cloudflare,
# so the peer address is a Cloudflare edge and REMOTE_ADDR would otherwise be
# useless (and identical) for every visitor — collapsing the whole internet
# into one rate-limit bucket.
server {
    listen 443 ssl;
    server_name api.bajasaebrasil.com.br;

    ssl_certificate     /etc/letsencrypt/live/bajasaebrasil.com.br/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/bajasaebrasil.com.br/privkey.pem;

    # Trust CF-Connecting-IP, but only when the connection actually comes from
    # Cloudflare. realip rewrites $remote_addr (and therefore the REMOTE_ADDR
    # fastcgi param) to the true client, so PHP needs no header handling and
    # stays identical between dev and prod.
    #
    # A request arriving from outside these ranges — direct-to-origin — does
    # not match, so $remote_addr stays the real peer and a spoofed header is
    # ignored rather than trusted.
    #
    # Ranges from https://www.cloudflare.com/ips-v4 and ips-v6. Cloudflare
    # changes these occasionally; re-check when adding origin IPs to the
    # firewall.
    set_real_ip_from 173.245.48.0/20;
    set_real_ip_from 103.21.244.0/22;
    set_real_ip_from 103.22.200.0/22;
    set_real_ip_from 103.31.4.0/22;
    set_real_ip_from 141.101.64.0/18;
    set_real_ip_from 108.162.192.0/18;
    set_real_ip_from 190.93.240.0/20;
    set_real_ip_from 188.114.96.0/20;
    set_real_ip_from 197.234.240.0/22;
    set_real_ip_from 198.41.128.0/17;
    set_real_ip_from 162.158.0.0/15;
    set_real_ip_from 104.16.0.0/13;
    set_real_ip_from 104.24.0.0/14;
    set_real_ip_from 172.64.0.0/13;
    set_real_ip_from 131.0.72.0/22;
    set_real_ip_from 2400:cb00::/32;
    set_real_ip_from 2606:4700::/32;
    set_real_ip_from 2803:f800::/32;
    set_real_ip_from 2405:b500::/32;
    set_real_ip_from 2405:8100::/32;
    set_real_ip_from 2a06:98c0::/29;
    set_real_ip_from 2c0f:f248::/32;
    real_ip_header CF-Connecting-IP;

    root /var/www/baja-app/api;
    index index.php;

    # No `$uri/` — see conf.d/baja-app-api.conf. It makes `/` hit nginx's
    # static handler, which 405s every non-GET/HEAD/POST, breaking preflights.
    location / {
        try_files $uri /index.php$is_args$args;
    }

    location ~ \.php$ {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_pass baja-app:9000;
        fastcgi_index index.php;
        include fastcgi_params;

        fastcgi_param SCRIPT_FILENAME /var/www/html/api$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PHP_VALUE "auto_prepend_file=/var/www/html/src/bootstrap.php";
        fastcgi_param HTTPS on;

        # Tells bootstrap.php this request is on the API vhost, where the URI
        # has no /api/ prefix to detect.
        fastcgi_param BAJA_API_VHOST 1;

        # realip has already resolved the true client into REMOTE_ADDR. Blank
        # the raw headers so nothing downstream can read the client-supplied
        # values by mistake.
        fastcgi_param HTTP_X_FORWARDED_FOR "";
        fastcgi_param HTTP_X_REAL_IP "";
        fastcgi_param HTTP_CF_CONNECTING_IP "";
    }
}
