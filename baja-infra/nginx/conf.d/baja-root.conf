server {
    # default_server claims the fallback for any request whose Host header
    # doesn't match a server_name in any conf — e.g., http://localhost/.
    # Without this, nginx falls back to the alphabetically-first conf
    # (baja-app-certificado.conf), which is surprising during local dev.
    listen 80 default_server;
    server_name baja.local;

    # Everything else: proxy to Next.js (baja-js container, port 3000).
    # The /css /js /img location blocks above must remain BEFORE this one —
    # Next.js does not have those legacy paths and would 404 them.
    location / {
        proxy_pass http://baja-js:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Websocket upgrade (HMR in dev; harmless in prod).
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
