server {
    listen 80;
    server_name baja.local;

    # Legacy static assets from default/
    location /css/ {
        alias /var/www/baja-app/default/css/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /js/ {
        alias /var/www/baja-app/default/js/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    location /img/ {
        alias /var/www/baja-app/default/img/;
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }

    # Root and other paths: stub for now. Next.js will live here later.
    location / {
        return 503 "baja.local root not yet wired to Next.js — try /css/, /js/, /img/, or one of the *.baja.local subdomains";
    }
}
