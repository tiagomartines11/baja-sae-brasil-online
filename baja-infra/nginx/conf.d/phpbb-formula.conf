server {
    listen 80;
    server_name forum.formula.local;

    root /var/www/phpbb-formula;
    index index.php index.html;

    # Attachment uploads: must stay above phpBB's max_filesize /
    # max_filesize_pm (10M on phpbb-formula) or nginx rejects the POST with a
    # 413 before phpBB or PHP ever run, which the board surfaces as a
    # generic "Erro HTTP". Keep in step with upload_max_filesize in
    # baja-infra/phpbb-formula/php-uploads.ini.
    client_max_body_size 12M;

    location ~ /(config\.php|common\.php|cache|files|images/avatars/upload|includes|(?<!ext/)phpbb(?!\w)|store|vendor) {
        deny all;
        internal;
    }

    location / {
        try_files $uri $uri/ @rewriteapp;
    }

    location @rewriteapp {
        rewrite ^(.*)$ /app.php/$1 last;
    }

    location ~ \.php(/|$) {
        fastcgi_split_path_info ^(.+\.php)(/.*)$;
        fastcgi_pass phpbb-formula:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME /var/www/html$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
    }

    location ~* \.(jpg|jpeg|gif|png|css|js|ico|svg|woff|woff2|ttf|eot)$ {
        expires 30d;
        add_header Cache-Control "public, no-transform";
    }
}
