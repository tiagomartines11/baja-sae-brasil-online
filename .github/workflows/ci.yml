name: ci

on:
  pull_request:
    branches:
      - master
      - develop
  push:
    branches:
      - master
      - develop

jobs:
  frontend:
    name: Frontend (baja-js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: baja-js
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20.x'
          cache: 'npm'
          cache-dependency-path: baja-js/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  php:
    name: Backend (baja-php)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: baja-php
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, intl, mysqli, gd, zip
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: baja-php/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('baja-php/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: PHP syntax check
        run: |
          find . -name '*.php' \
            -not -path './vendor/*' \
            -not -path './src/Baja/Model/Base/*' \
            -not -path './src/Baja/Model/Map/*' \
            -print0 | xargs -0 -n1 -P4 php -l

      # Lap counting engine: pure logic, needs no database.
      #
      # The "db" suite (upload endpoint, score publishing, counter links) is
      # NOT run here, because this job has no MySQL or Redis. Run it locally
      # in the dev container before merging anything under
      # src/Baja/Contagem/ or juiz/contagem*:
      #
      #   cd baja-infra
      #   docker compose exec -e BAJA_TEST_DB=1 baja-app vendor/bin/phpunit --testsuite db
      #
      # BAJA_TEST_DB=1 is what allows those tests to write (and then delete)
      # their own rows. Never set it against production.
      - name: PHPUnit (lap counting engine)
        run: vendor/bin/phpunit --testsuite engine

      # Small helpers from the rest of the site, e.g. the judge pages. Also
      # pure logic with no database.
      - name: PHPUnit (unit helpers)
        run: vendor/bin/phpunit --testsuite unit

      # The results snapshot tool itself, on made-up pages. The snapshots
      # are checked against a real database in the results-snapshots job.
      - name: PHPUnit (results snapshot tool)
        run: vendor/bin/phpunit --testsuite results-snapshot

      # The browser-side logic of the count pages (offline queue, clock
      # offset, warnings) is plain ES modules tested with Node's built-in
      # runner; there is nothing to install.
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '24.x'

      - name: Browser logic tests (node --test)
        working-directory: ${{ github.workspace }}
        run: node --test "baja-php/tests/js/*.test.js"

  # Results regression snapshots (docs/results-snapshots.md): runs every
  # results page, premiação and prova formula against the dev seed and fails
  # if anything they compute differs from baja-php/tests/results-snapshots/.
  #
  # Only MySQL is needed, not the compose stack: the pages run with
  # SKIP_AUTH, as nginx serves them, so there is no forum session, no Redis
  # and no nginx in the path. The tool runs them with the PHP command line,
  # the same code php-fpm would run.
  results-snapshots:
    name: Results snapshots (baja-php)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          # As in docker-compose.yml.
          TZ: America/Sao_Paulo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      # The tool connects like the app does (src/config.php), as an account
      # that may only SELECT, created below. Read-only twice over: the tool
      # also switches every session it opens to read-only.
      PHPBB_DB_HOST: 127.0.0.1
      PHPBB_DB_USER: snapshot
      PHPBB_DB_PASS: snapshot
    defaults:
      run:
        working-directory: baja-php
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, dom, intl, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v4
        with:
          path: baja-php/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('baja-php/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      # What the app's database needs, from the same files the dev MySQL
      # container loads on first boot:
      #   01  creates the databases
      #   02  creates the app's MySQL users (not used by the snapshots, run
      #       so that the database is the one dev has)
      #   05  the results data: 17 events, 22BR to 26BR
      #   06  the lap counting tables; it also edits the 26BR Enduro's
      #       inputs list, so without it CI would not match a dev database
      # 03 and 04 are the forum databases, which SKIP_AUTH pages never read.
      - name: Load the dev seed
        working-directory: baja-infra/mysql/init
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_ROOT_PASSWORD: root
          MYSQL_RESULTADOS_PASSWORD: unused-in-ci
          MYSQL_PHPBB_BAJA_PASSWORD: unused-in-ci
          MYSQL_PHPBB_FORMULA_PASSWORD: unused-in-ci
        run: |
          mysql -uroot -proot < 01-create-databases.sql
          bash 02-create-users.sh
          mysql -uroot -proot < 05-seed-baja-resultados.sql
          mysql -uroot -proot < 06-contagem.sql
          mysql -uroot -proot -e "CREATE USER 'snapshot'@'%' IDENTIFIED BY 'snapshot'; GRANT SELECT ON baja_resultados.* TO 'snapshot'@'%';"

      - name: PHPUnit (the tool writes nothing)
        run: vendor/bin/phpunit --testsuite results-snapshot-db

      # The public results API (docs/results-api.md) on the seed, as the
      # SELECT-only "snapshot" account: every table equals the results
      # builder's public one, spoilers included. --fail-on-skipped: a test
      # skipped here would be a check nobody ran.
      - name: PHPUnit (public results API)
        run: vendor/bin/phpunit --testsuite results-api-db --fail-on-skipped

      # scripts/check-results-configs.php (docs/results-config-check.md):
      # writes nothing, finds the seed's known broken configs, and survives a
      # formula that kills PHP. That last test loads a made-up event first
      # (BAJAAPP-63), so it needs BAJA_TEST_DB=1 and an account that may
      # write; the tool itself still runs as the SELECT-only "snapshot".
      # --fail-on-skipped: a test skipped here would be a check nobody ran.
      - name: PHPUnit (resultado config check)
        env:
          BAJA_TEST_DB: '1'
          BAJA_TEST_DB_USER: root
          BAJA_TEST_DB_PASS: root
        run: vendor/bin/phpunit --testsuite results-check-db --fail-on-skipped

      # Prova totals ($Xmax, $Xcount, $Xsum...): saves a made-up event's prova
      # and reads its totals back (BAJAAPP-65), then deletes the event. It
      # writes, so it needs BAJA_TEST_DB=1 and the account that may write.
      - name: PHPUnit (prova totals)
        env:
          BAJA_TEST_DB: '1'
          BAJA_TEST_DB_USER: root
          BAJA_TEST_DB_PASS: root
        run: vendor/bin/phpunit --testsuite prova-db --fail-on-skipped

      - name: Results snapshots match
        run: php scripts/results-snapshot.php --check --jobs 4

  infra:
    name: Infrastructure (baja-infra)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate docker-compose syntax
        working-directory: baja-infra
        run: |
          # docker compose config will fail on syntax errors, missing
          # required env vars, or invalid service definitions.
          # We use --quiet to suppress the resolved YAML output.
          cp .env.example .env 2>/dev/null || true
          docker compose config --quiet
