name: ci

on:
  pull_request:
    branches:
      - master
      - develop
  push:
    branches:
      - master
      - develop

jobs:
  frontend:
    name: Frontend (baja-js)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: baja-js
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'
          cache: 'npm'
          cache-dependency-path: baja-js/package-lock.json

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

  php:
    name: Backend (baja-php)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: baja-php
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, intl, mysqli, gd, zip
          coverage: none
          tools: composer:v2

      - name: Validate composer.json
        run: composer validate --strict --no-check-publish

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: baja-php/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('baja-php/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      - name: PHP syntax check
        run: |
          find . -name '*.php' \
            -not -path './vendor/*' \
            -not -path './src/Baja/Model/Base/*' \
            -not -path './src/Baja/Model/Map/*' \
            -print0 | xargs -0 -n1 -P4 php -l

      # Lap counting engine: pure logic, needs no database.
      #
      # The "db" suite (upload endpoint, score publishing, counter links) is
      # NOT run here, because this job has no MySQL or Redis. Run it locally
      # in the dev container before merging anything under
      # src/Baja/Contagem/ or juiz/contagem*:
      #
      #   cd baja-infra
      #   docker compose exec -e BAJA_TEST_DB=1 baja-app vendor/bin/phpunit --testsuite db
      #
      # BAJA_TEST_DB=1 is what allows those tests to write (and then delete)
      # their own rows. Never set it against production.
      - name: PHPUnit (lap counting engine)
        run: vendor/bin/phpunit --testsuite engine

      # Small helpers from the rest of the site, e.g. the judge pages. Also
      # pure logic with no database.
      - name: PHPUnit (unit helpers)
        run: vendor/bin/phpunit --testsuite unit

      # The results snapshot tool itself, on made-up pages. The snapshots
      # are checked against a real database in the results-snapshots job.
      - name: PHPUnit (results snapshot tool)
        run: vendor/bin/phpunit --testsuite results-snapshot

      # The browser-side logic of the count pages (offline queue, clock
      # offset, warnings) is plain ES modules tested with Node's built-in
      # runner; there is nothing to install.
      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: '24.x'

      - name: Browser logic tests (node --test)
        working-directory: ${{ github.workspace }}
        run: node --test "baja-php/tests/js/*.test.js"

  # Results regression snapshots (docs/results-snapshots.md): runs every
  # results page, premiação and prova formula against the dev seed and fails
  # if anything they compute differs from baja-php/tests/results-snapshots/.
  #
  # Only MySQL is needed, not the compose stack: the pages run with
  # SKIP_AUTH, as nginx serves them, so there is no forum session, no Redis
  # and no nginx in the path. The tool runs them with the PHP command line,
  # the same code php-fpm would run.
  results-snapshots:
    name: Results snapshots (baja-php)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          # As in docker-compose.yml.
          TZ: America/Sao_Paulo
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    env:
      # The tool connects like the app does (src/config.php), as an account
      # that may only SELECT, created below. Read-only twice over: the tool
      # also switches every session it opens to read-only.
      PHPBB_DB_HOST: 127.0.0.1
      PHPBB_DB_USER: snapshot
      PHPBB_DB_PASS: snapshot
    defaults:
      run:
        working-directory: baja-php
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.3'
          extensions: mbstring, xml, dom, intl, pdo_mysql
          coverage: none
          tools: composer:v2

      - name: Cache Composer dependencies
        uses: actions/cache@v6
        with:
          path: baja-php/vendor
          key: ${{ runner.os }}-composer-${{ hashFiles('baja-php/composer.lock') }}
          restore-keys: |
            ${{ runner.os }}-composer-

      - name: Install dependencies
        run: composer install --no-progress --prefer-dist --no-interaction

      # What the app's database needs, from the same files the dev MySQL
      # container loads on first boot:
      #   01  creates the databases
      #   02  creates the app's MySQL users (not used by the snapshots, run
      #       so that the database is the one dev has)
      #   05  the results data: 17 events, 22BR to 26BR
      #   06  the lap counting tables; it also edits the 26BR Enduro's
      #       inputs list, so without it CI would not match a dev database
      #   07  the event archive queue (BAJAAPP-67)
      # 03 and 04 are the forum databases, which SKIP_AUTH pages never read.
      - name: Load the dev seed
        working-directory: baja-infra/mysql/init
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_ROOT_PASSWORD: root
          MYSQL_RESULTADOS_PASSWORD: unused-in-ci
          MYSQL_PHPBB_BAJA_PASSWORD: unused-in-ci
          MYSQL_PHPBB_FORMULA_PASSWORD: unused-in-ci
          # 02 also creates the read-only backup user, and runs under set -u.
          MYSQL_BACKUP_USER: backup
          MYSQL_BACKUP_PASSWORD: unused-in-ci
        run: |
          mysql -uroot -proot < 01-create-databases.sql
          bash 02-create-users.sh
          mysql -uroot -proot < 05-seed-baja-resultados.sql
          mysql -uroot -proot < 06-contagem.sql
          mysql -uroot -proot < 07-evento-arquivamento.sql
          mysql -uroot -proot -e "CREATE USER 'snapshot'@'%' IDENTIFIED BY 'snapshot'; GRANT SELECT ON baja_resultados.* TO 'snapshot'@'%';"

      - name: PHPUnit (the tool writes nothing)
        run: vendor/bin/phpunit --testsuite results-snapshot-db

      # The public results API (docs/results-api.md) on the seed, as the
      # SELECT-only "snapshot" account: every table equals the results
      # builder's public one, spoilers included. --fail-on-skipped: a test
      # skipped here would be a check nobody ran.
      #
      # There is no Redis in this job, and the live race endpoint's feed
      # asks for it. The code falls back without it either way, but the
      # default host "redis" does not resolve here and PHP warns about the
      # lookup; nothing listening on localhost fails quietly.
      - name: PHPUnit (public results API)
        env:
          REDIS_HOST: 127.0.0.1
        run: vendor/bin/phpunit --testsuite results-api-db --fail-on-skipped

      # scripts/check-results-configs.php (docs/results-config-check.md):
      # writes nothing, finds the seed's known broken configs, and survives a
      # formula that kills PHP. That last test loads a made-up event first
      # (BAJAAPP-63), so it needs BAJA_TEST_DB=1 and an account that may
      # write; the tool itself still runs as the SELECT-only "snapshot".
      # --fail-on-skipped: a test skipped here would be a check nobody ran.
      - name: PHPUnit (resultado config check)
        env:
          BAJA_TEST_DB: '1'
          BAJA_TEST_DB_USER: root
          BAJA_TEST_DB_PASS: root
        run: vendor/bin/phpunit --testsuite results-check-db --fail-on-skipped

      # Prova totals ($Xmax, $Xcount, $Xsum...): saves a made-up event's prova
      # and reads its totals back (BAJAAPP-65), then deletes the event. It
      # writes, so it needs BAJA_TEST_DB=1 and the account that may write.
      - name: PHPUnit (prova totals)
        env:
          BAJA_TEST_DB: '1'
          BAJA_TEST_DB_USER: root
          BAJA_TEST_DB_PASS: root
        run: vendor/bin/phpunit --testsuite prova-db --fail-on-skipped

      # The event archive queue (BAJAAPP-67): marking an event finalizado
      # records exactly one pending archive, and the nightly job consumes
      # it. Writes a made-up event, so BAJA_TEST_DB=1 and the account that
      # may write. --fail-on-skipped: a test skipped here would be a check
      # nobody ran.
      - name: PHPUnit (event archive queue)
        env:
          BAJA_TEST_DB: '1'
          BAJA_TEST_DB_USER: root
          BAJA_TEST_DB_PASS: root
        run: vendor/bin/phpunit --testsuite results-archive-db --fail-on-skipped

      # scripts/formula-engine-compare.php (docs/formula-engine.md): on the
      # seed, eval() and the new formula engine give the same value for every
      # formula and team, and the tool writes nothing. CompareFixtureTest loads
      # a made-up event first (formulas that differ, formulas that kill PHP),
      # so it needs BAJA_TEST_DB=1 and an account that may write; the tool
      # itself still runs as the SELECT-only "snapshot".
      - name: PHPUnit (formula engine comparison)
        env:
          BAJA_TEST_DB: '1'
          BAJA_TEST_DB_USER: root
          BAJA_TEST_DB_PASS: root
        run: vendor/bin/phpunit --testsuite formula-compare-db --fail-on-skipped

      - name: Results snapshots match
        run: php scripts/results-snapshot.php --check --jobs 4

      # The same snapshots, every formula worked out by the engine that will
      # replace eval() (BAJAAPP-35). The site still runs eval() (the default);
      # this proves the new engine publishes exactly the same results.
      - name: Results snapshots match with FORMULA_ENGINE=safe
        env:
          FORMULA_ENGINE: safe
        run: php scripts/results-snapshot.php --check --jobs 4

      # The backup MySQL user against this real server: its exact grants,
      # that it cannot read mysql.user (password hashes) or write, that the
      # backup's own dump code still dumps all three databases with only
      # those grants, and that restoring a dump replaces a database instead
      # of merging into it. Last, because it restores baja_resultados over
      # itself; the forum seeds (03, 04) are loaded only for this.
      - name: Backup user and dumps
        working-directory: baja-infra
        env:
          MYSQL_HOST: 127.0.0.1
          MYSQL_ROOT_PASSWORD: root
          MYSQL_BACKUP_USER: backup
          MYSQL_BACKUP_PASSWORD: unused-in-ci
        run: |
          mysql -h127.0.0.1 -uroot -proot < mysql/init/03-seed-phpbb-baja.sql
          mysql -h127.0.0.1 -uroot -proot < mysql/init/04-seed-phpbb-formula.sql
          tests/backup/dump-with-backup-user.sh

  infra:
    name: Infrastructure (baja-infra)
    runs-on: ubuntu-latest
    # Throwaway, for the restore and floor tests in run-tests.sh: they make
    # and drop their own fake baja_resultados.
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -uroot -proot"
          --health-interval=5s --health-timeout=5s --health-retries=30
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Shellcheck
        run: |
          # -x follows sourced files. The scripts carry
          # `# shellcheck source-path=SCRIPTDIR`, so backup-lib.sh is
          # resolved regardless of the working directory.
          #
          # Scoped to the directories this repo actually maintains as
          # scripts. The phpBB entrypoints are excluded: they trip SC2016
          # on `envsubst '${VAR}'`, where the single quotes are envsubst's
          # variable whitelist and removing them would break the config
          # templating. Worth silencing there one day, but not from a
          # backups change.
          find baja-infra/scripts baja-infra/mysql/init baja-infra/tests -name '*.sh' -print0 \
            | xargs -0 shellcheck -x
          shellcheck baja-infra/tests/backup/fake-bin/rclone

      - name: Validate docker-compose syntax
        working-directory: baja-infra
        run: |
          # docker compose config will fail on syntax errors, missing
          # required env vars, or invalid service definitions.
          # We use --quiet to suppress the resolved YAML output.
          cp .env.example .env 2>/dev/null || true
          docker compose config --quiet
          # The verify stack is a separate compose project and is never
          # brought up by `docker compose up`, so nothing else would
          # notice it going stale.
          docker compose -f docker-compose.verify.yml config --quiet

      # Every install that predates the backups has an .env without any of
      # their variables. Merging must not break it: a blank variable in a
      # volume path is an "invalid spec" and stops `docker compose up` for
      # the whole stack, not just the backup services. Pinned to develop's
      # .env.example from before the backups (841d172), since develop's own
      # copy gains the variables once this lands.
      - name: Compose config with a pre-backups .env
        working-directory: baja-infra
        run: |
          git fetch --no-tags --depth=1 origin 841d1724d481ae8f48a2ee1d41f34ac820f669b9
          git show 841d1724d481ae8f48a2ee1d41f34ac820f669b9:baja-infra/.env.example > "$RUNNER_TEMP/old.env"
          docker compose --env-file "$RUNNER_TEMP/old.env" \
            -f docker-compose.yml -f docker-compose.prod.yml config --quiet
          docker compose --env-file "$RUNNER_TEMP/old.env" \
            -f docker-compose.yml -f docker-compose.prod.yml --profile tools config --quiet
          docker compose --env-file "$RUNNER_TEMP/old.env" \
            -f docker-compose.verify.yml config --quiet

      - name: Retention pruner tests
        # Apps Script cannot run in CI, so the pruner's logic is exercised
        # against a fake Drive. It is the only code in the backup system
        # that can actively destroy data.
        run: node baja-infra/gas/retention/test/prune.test.js

      # The backup scripts on made-up files with a fake Shared Drive: file
      # set and erasure log round trips, the manifest, manifest-last, the
      # event archives. Needs age; nothing else beyond the runner's tools.
      # With the MySQL service above: restore-db.sh (BAJAAPP-4) and the
      # verifier's participantes floor. TEST_MYSQL_REQUIRED=1 makes a
      # skipped MySQL test a failure.
      - name: Backup script tests
        env:
          TEST_MYSQL_HOST: 127.0.0.1
          TEST_MYSQL_PORT: '3306'
          TEST_MYSQL_ROOT_PASSWORD: root
          TEST_MYSQL_REQUIRED: '1'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq age
          baja-infra/tests/backup/run-tests.sh
